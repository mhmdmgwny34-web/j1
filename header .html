<!-- ========================================== -->
<!-- ۲. هدر اصلی + فرم جستجو (اصلاح شده) -->
<!-- ========================================== -->
<header class="hero-bg d-flex align-items-center pt-5 mt-5 position-relative">
    <!-- لایه تیره برای خوانایی متن -->
    <div class="overlay-dark position-absolute top-0 start-0 w-100 h-100"></div>
    
    <div class="container position-relative">
        <div class="row justify-content-center text-center">
            <!-- متن‌ها وسط‌چین شدند -->
            <div class="col-lg-8 text-white mb-4">
                <h1 class="display-4 fw-bold mb-3">ساخت رویاها، یک خانه در هر زمان</h1>
                <p class="lead text-white-50 mb-4">ما بهترین املاک را برای شما فراهم می‌کنیم. با جستجو در بین هزاران آگهی، خانه رویایی خود را پیدا کنید.</p>
            </div>
            <!-- فرم جستجو وسط‌چین شد -->
            <div class="col-lg-8">
                <div class="card border-0 shadow-lg rounded-4 p-4">
                    <h5 class="mb-3 fw-bold text-dark">جستجوی سریع ملک</h5>
                    <form>
                        <div class="row g-3">
                            <div class="col-md-6">
                                <select class="form-select border-0 bg-light">
                                    <option>نوع ملک</option>
                                    <option>آپارتمان</option>
                                    <option>ویلا</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <select class="form-select border-0 bg-light">
                                    <option>منطقه</option>
                                    <option>نیاوران</option>
                                    <option>زعفرانیه</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <input type="text" class="form-control border-0 bg-light" placeholder="حداقل قیمت">
                            </div>
                            <div class="col-md-6">
                                <input type="text" class="form-control border-0 bg-light" placeholder="حداکثر قیمت">
                            </div>
                            <div class="col-12">
                                <button type="submit" class="btn btn-dark w-100 py-2 fw-bold"><i class="bi bi-search me-2"></i>جستجو</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</header>
